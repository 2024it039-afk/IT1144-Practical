<!DOCTYPE html>
<htmml>
    <head>
        <style>
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family:"playfair display",serif;
}
body{
    background-color: #121212;
    color: #ffffff;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.hero{
    width: 100%;
    max-width: 900px;
    margin-bottom: 30px;
}  
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
}
.logo{
    display: none;
}
.nav-links{
    display: flex;
    list-style: none;
    gap:25px;
    margin-left: auto;
    justify-content: center;
    align-items: center;
    margin-left:120px ;
    margin-right: 30px;
    justify-content: center;
}
.nav-links a{
    color:#f1ebd9;
    text-decoration: none;
    font-size: larger;
    font-family: sans-serif;
}

.container2{
    width:100%;
    max-width:850px;
    margin:30px auto;
    padding:40px;
    border:1px solid rgba(255, 255, 255, 0.1);
    border-radius:16px;
    background:#1c1c1c;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    position:relative;
}

.container2 h1{
    text-align:center;
    color:#ffb3c6;
    font-weight: 400;
    margin-bottom: 8px;
    font-size:2.8rem;
}

.container2 p{
    text-align:center;
    margin-top:10px;
    color:#d1cfc7;
    font-family: sans-serif;
    font-size: 1rem;
    margin-bottom: 40px;
}

.content2{
    display:flex;
    justify-content:space-between;
    gap:40px;
}

.form{
    flex:1;
}
.form h2{
    font-size: 1.3rem;
    font-weight:400px;
    color:#ffff;
    margin-bottom: 15px;
}
.flowers,.packing{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
    margin-bottom: 25px;
}
.option{
    display: flex;
    align-items: center;
    gap: 10pxpx;
    font-family: sans-serif;
    color:#ffffff;
    font-size: 1.05rem;
}
.option input[type="checkbox"],.option input[type="radio"]{
    accent-color:#ffb3c6;
    width:18px;
    height: 18px;
}
#note{
    width:100%;
    height: 80px;
    background: #121212;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:8px;
    color:#ffffff;
    padding:6px;
    font-family: sans-serif;
    
    outline:none;
}
.button{
    width:100%;
    height: fit-content;
    background-color: #ffb3c6;
    color:#121212;
    border:none;
    padding:50px;
    font-size:medium;
    font-family: sans-serif;
    font-weight: 600px;
    border-radius:8px;
    margin-top: 20px;
}

.right{
    display: flex;
    flex-direction: column;
    align-items:center;
    width:260px;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin:15px 0;
    font-size:20px;
}

hr{
    margin:25px 0;
    border:none;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    margin: 25px 0;
}

textarea{
    width:40%;
    height:90px;
    background:#0f1117;
    border:1px solid #555;
    border-radius:8px;
    color:white;
    padding:10px;
    margin-top:10px;
}

.form button{
    width:40%;
    margin-top:20px;
    padding:10px;
    padding-right: 20px;
    border:none;
    border-radius:8px;
    background:#f4b8c5;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.form button:hover{
    transform:translateY(-2px);
}
.preview-box{
    width:100%;
    height:280px;
    border-radius:15px;
    background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.05)),
    url("backnew.jpeg") center/cover;
    border-radius: 12px;
    display:flex;
    justify-content: center;
    align-items: center;
    font-size: 4rem;
    position:relative;
    overflow: hidden;
    box-shadow: inset 0 0 0 100px rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
   
}

.right p{
    margin-top:15px;
    color:#8aaa;
    font-family: sans-serif;
    font-size: 9.5rem;
}


        </style>
    </head>
    <title>Customize.html</title>
    <body>
        <div class="hero">
            <!--Header section-->
            <nav class="navbar">
                <div class="logo">
                    <img src="logo.jpeg">
                </div>
            <ul class="nav-links">
                <li><a href="Home.html">Home</a></li>
                <li><a href="collections.html">Collections</a></li>
                <li><a href="Customize.html">Customize</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            </nav>
        </div>
        <!--content-->
        <div class="container2">
            <h1>Design Your Bunch</h1>
            <p>Select flowers you love,packing you want</p>
            <div class="content2">
                <div class="form">
                    <h2>1.Choose Main Blooms</h2>
                    <div class="flowers">
                    <label class="option">
                        <input type="checkbox" name="blooms" value="pink-roses">Pink Roses</label>
                    <label class="option">
                        <input type="checkbox" name="blooms" value="Peonies">Peonies</label>
                    <label class="option">
                        <input type="checkbox" name="blooms" value="tulips">Tulips</label>
                    <label class="option">
                        <input type="checkbox" name="blooms" value="white-lilies">White Lilies</label>
                    </div>
                
                    <hr>
                    <h2>2.Choose Premium Packing</h2>
                    <div class="packing">
                    <label class="option"><input type="radio" name="pack">Matte Pink Wrap</label>
                    <label class="option"><input type="radio" name="pack">Luxury Black Box</label>
                    <label class="option"><input type="radio" name="pack">Glass Vase</label>
                    </div>
                    <hr>
                    <h2>3.Gift Note</h2>
                    <textarea id="note"></textarea><br><br>
                    <button onclick="addToCart()">
                        Add to Cart
                    </button>
                </div>
                <div class = "right">
                    <div class="preview-box">
                        
                    </div>
                </div>
            </div>
        </div>
         <script src="script.js"></script>
    </body>
</htmml>
